name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, nightly]
        profile: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}-cargo-build-
            ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}-

      - name: Build workspace (debug)
        if: matrix.profile == 'debug'
        run: cargo build --workspace --verbose

      - name: Build workspace (release)
        if: matrix.profile == 'release'
        run: cargo build --workspace --verbose --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}
          path: target/${{ matrix.profile }}
          retention-days: 1

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    needs: build
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, nightly]
        profile: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo-expand
        id: cache-cargo-expand
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-expand
          key: ${{ runner.os }}-cargo-expand

      - name: Install cargo-expand
        if: steps.cache-cargo-expand.outputs.cache-hit != 'true'
        run: cargo install cargo-expand

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}-cargo-build-
            ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}-

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}
          path: target/${{ matrix.profile }}

      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --verbose --release

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/index
          key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ubuntu-stable-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-stable-clippy-
            ubuntu-stable-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-expand
        id: cache-cargo-expand
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-expand
          key: ${{ runner.os }}-cargo-expand

      - name: Install cargo-expand
        if: steps.cache-cargo-expand.outputs.cache-hit != 'true'
        run: cargo install cargo-expand

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/index
          key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ubuntu-stable-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-stable-coverage-
            ubuntu-stable-

      - name: Generate coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Generate coverage (HTML)
        run: cargo llvm-cov --workspace --html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 7

      - name: Check coverage threshold (90% - non-blocking)
        continue-on-error: true
        run: |
          echo "Checking coverage threshold (90%)..."
          cargo llvm-cov --workspace --fail-under-lines 90 || echo "⚠️  Coverage is below 90% threshold, but this is non-blocking for now."
